name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Configuration de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Installation des dépendances de développement
        uses: ramsey/composer-install@v3

      - name: Analyse statique (WordPress Coding Standards)
        run: composer lint

      - name: Tests unitaires
        run: |
          if [ -n "$(find tests/unit -name '*Test.php' -print -quit)" ]; then
            composer test
          else
            echo "Aucun test unitaire pour le moment — étape ignorée."
          fi

  docker:
    name: Validation de la stack Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation de docker-compose.yml
        run: docker compose config --quiet
      - name: Analyse du script d'installation
        run: shellcheck .docker/init.sh

# Environnement de développement local — exercice technique Attineos.
#
# Les identifiants ci-dessous figurent volontairement en clair : il s'agit
# d'une stack jetable, sans port de base de données exposé et sans donnée
# réelle. Ces valeurs ne sont pas des secrets. Voir la section « Choix
# techniques » du README.
#
# Trois services :
#   db        : base de données MariaDB, accessible uniquement depuis le réseau Docker
#   wordpress : le site, avec uniquement le plugin monté en volume
#   wpcli     : conteneur utilitaire à la demande (profil "cli"), jamais résident
#
# Le cœur de WordPress vit dans un volume Docker nommé : il n'est jamais
# écrit dans le dépôt, conformément aux consignes de l'exercice.
#
# Port 8080 déjà occupé ? Créer un docker-compose.override.yml local
# redéfinissant le mappage de ports — Compose le fusionne automatiquement.

services:

  db:
    image: mariadb:11.4
    container_name: books_db
    restart: unless-stopped
    # Aucune section `ports` : la base n'est joignable que depuis le réseau
    # interne Docker, jamais depuis la machine hôte.
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root-local-only
    volumes:
      - db_data:/var/lib/mysql
    # Sans ce healthcheck, WordPress démarre avant que MariaDB n'accepte
    # les connexions et l'installation échoue de façon intermittente.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  wordpress:
    image: wordpress:6.8-php8.2-apache
    container_name: books_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - wp_core:/var/www/html
      # Seul le plugin est monté depuis le dépôt.
      - ./books-list:/var/www/html/wp-content/plugins/books-list

  wpcli:
    image: wordpress:cli-php8.2
    container_name: books_cli
    profiles: ["cli"]
    # www-data (33:33) : sans cela, les fichiers écrits par WP-CLI
    # appartiennent à root et Apache ne peut plus les lire (Linux / WSL).
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Paramètres consommés par .docker/init.sh — source unique de vérité.
      WP_URL: http://localhost:8080
      WP_TITLE: Exercice Attineos - Books List
      WP_ADMIN_USER: demo
      WP_ADMIN_PASSWORD: demo-local-only
      WP_ADMIN_EMAIL: demo@example.test
      WP_LOCALE: fr_FR
      # www-data n'a pas de dossier personnel accessible en écriture : sans
      # cela WP-CLI échoue à créer son cache et pollue la sortie.
      HOME: /tmp
    volumes:
      - wp_core:/var/www/html
      - ./books-list:/var/www/html/wp-content/plugins/books-list
      - ./.docker:/scripts:ro

volumes:
  db_data:
  wp_core:
